<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="If you want the best burger in the city, you just need to deliver the food in MacDelivery">
    <title>McDonald's</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 class="header__logo">McDonald's</h1>

        <div class="header__cart">
            Added to cart: <span class="header__cart-count">0</span>
            Total: <span class="header__cart-total">0</span>$
        </div>

        <button class="clear-cart-btn">Clear all</button>
    </header>

    <p class="intro-text">If you want to enjoy the burger with beef steak and eggs, you need to deliver the Big mac!</p>
    
    <nav>
        <a href="#home">Home</a>
        <a href="#payment">Add card</a>
    </nav>

    <div class="cart-section">
            <h2>Your Cart</h2>
            <div class="cart-items">
                <p class="empty-cart-text">Your cart is empty...</p>
            </div>
            <button class="checkout-btn">Checkout Order</button>
        </div>

    <div id="product-container"class="product-grid"></div>
      
    <main>
        <div id="home">
            <h1>Home</h1>
        </div>

        <div class="categories">
            <button data-category="all">All</button>
            <button data-category="burgers">Burgers</button>
            <button data-category="snacks">Snacks</button>
            <button data-category="drinks">Drinks</button>
            <button data-category="desserts">Desserts</button>
            <button data-category="super-sets">Super-sets</button>
        </div>

        
        <div id="loader" class="loader-container" style="display: none;">
            <div class="spinner"></div>
            <p>Preparing...</p>
        </div>
        <div class="menu-grid">
        </div>
                

        <div id="payment">
            <section class="registration-section">
                <h2>Registration</h2>
                <form class="registration-form">
                    <div class="form-group">
                        <label for="username">Enter name:</label>
                        <input type="text" id="username" name="username" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Please enter your email:</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>
                    <button type="submit" class="submit-btn">Subscribe</button>
                </form>
            </section>
        </div>
    </main>
    <script src="app.js">
    </script>
</body>
</html>
